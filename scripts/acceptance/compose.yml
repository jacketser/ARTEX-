services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: isolated-acceptance-only
      POSTGRES_DB: verify
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U verify -d verify]
      interval: 1s
      timeout: 3s
      retries: 60
  app:
    image: ${ARTEX_ACCEPTANCE_IMAGE:-jacketser/artex:local}
    environment:
      ARTEX_PG_DSN: postgres://verify:isolated-acceptance-only@postgres:5432/verify?sslmode=disable
      GOMAXPROCS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      target:
        condition: service_healthy
      upstream:
        condition: service_healthy
    volumes:
      - ./:/acceptance:ro
    shm_size: 256mb
    init: true
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8787/api/health]
      interval: 2s
      timeout: 3s
      retries: 60
  upstream:
    image: ${ARTEX_ACCEPTANCE_IMAGE:-jacketser/artex:local}
    entrypoint: [python3, /acceptance/behavior-proxy.py]
    volumes:
      - ./:/acceptance:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/metrics]
      interval: 1s
      timeout: 3s
      retries: 60
  target:
    image: ${ARTEX_ACCEPTANCE_IMAGE:-jacketser/artex:local}
    entrypoint: [python3, /acceptance/behavior-target.py]
    volumes:
      - ./:/acceptance:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/metrics]
      interval: 1s
      timeout: 3s
      retries: 60
  content-target:
    profiles: [content]
    environment:
      ARTEX_ACCEPTANCE_BASELINE: ${ARTEX_ACCEPTANCE_BASELINE:-0}
    image: ${ARTEX_ACCEPTANCE_IMAGE:-jacketser/artex:local}
    entrypoint: [python3, /acceptance/content-target.py]
    volumes:
      - ./:/acceptance:ro
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/metrics]
      interval: 1s
      timeout: 3s
      retries: 60
networks:
  default:
    internal: true
